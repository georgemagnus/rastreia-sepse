<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="redFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="blackFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgFav)" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(239,68,68,0.2)" stroke-width="3" />

  <g filter="url(#favShadow)" transform="translate(48, 28) scale(0.82)">
    <!-- Black Ribbon Loop -->
    <path d="M 235 60 C 275 60, 315 95, 315 155 C 315 205, 275 250, 240 285 L 170 345 L 115 385 L 105 320 L 175 270 C 215 225, 260 185, 260 150 C 260 115, 235 95, 205 95 C 185 95, 170 105, 160 118 Z" fill="url(#blackFav)" />

    <!-- Red Ribbon Loop -->
    <path d="M 195 55 C 245 55, 275 80, 285 105 L 245 130 C 235 100, 215 90, 195 90 C 160 90, 135 125, 135 175 C 135 220, 165 260, 210 295 L 285 355 L 255 385 C 205 340, 95 245, 95 165 C 95 95, 140 55, 195 55 Z" fill="url(#redFav)" />

    <!-- Flowing Red Wave Ribbon -->
    <path d="M 245 320 C 285 350, 360 405, 410 445 C 435 465, 440 485, 435 505 C 425 535, 385 570, 320 610 L 320 545 C 365 515, 395 490, 395 475 C 395 460, 360 435, 310 395 L 245 345 Z" fill="url(#redFav)" />
